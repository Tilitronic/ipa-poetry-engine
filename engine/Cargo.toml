[workspace]
members = [
    "crates/core",
    "crates/py_binding",
    "crates/web_binding",
]
resolver = "2"

[workspace.dependencies]
ndarray    = "0.16"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# Optimised WASM release build (used by web_binding / wasm-pack)
[profile.release]
opt-level = "z"   # minimise binary size
lto       = true  # cross-crate link-time optimisation
